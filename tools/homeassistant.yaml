tools:
  ha_get_state:
    description: "Get entity state from Home Assistant"
    signature: "{entity_id}"
    args:
      entity_id:
        required: true
        validate: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
    risk: low
    remember: signature
    request:
      method: GET
      path: "/api/states/{entity_id}"

  ha_get_states:
    description: "Get all entity states from Home Assistant"
    risk: low
    request:
      method: GET
      path: "/api/states"
    response:
      wrap: "states"

  ha_get_services:
    description: "List available services and their fields"
    risk: low
    request:
      method: GET
      path: "/api/services"
    response:
      wrap: "services"

  ha_get_history:
    description: "Get state history for an entity (last 24h)"
    signature: "{entity_id}"
    args:
      entity_id:
        required: true
        validate: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
    risk: low
    remember: signature
    request:
      method: GET
      path: "/api/history/period"
      query:
        filter_entity_id: "{entity_id}"
    response:
      wrap: "history"

  ha_get_logbook:
    description: "Get logbook entries for an entity (last 24h)"
    signature: "{entity_id}"
    args:
      entity_id:
        required: true
        validate: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
    risk: low
    remember: signature
    request:
      method: GET
      path: "/api/logbook"
      query:
        entity: "{entity_id}"
    response:
      wrap: "logbook"

  ha_get_config:
    description: "Get Home Assistant configuration"
    risk: low
    request:
      method: GET
      path: "/api/config"
    response:
      wrap: "config"

  ha_render_template:
    description: "Render a Home Assistant template"
    signature: "{template}"
    args:
      template:
        required: true
        description: "Jinja template"
    risk: low
    request:
      method: POST
      path: "/api/template"
    response:
      wrap: "rendered"

  ha_call_service:
    description: "Call a Home Assistant service"
    signature: "{domain}.{service}, {entity_id}"
    args:
      domain:
        required: true
        validate: "^[a-z][a-z0-9_]*$"
      service:
        required: true
        validate: "^[a-z][a-z0-9_]*$"
      entity_id:
        required: false
        validate: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
      # Service data: declared and typed, not part of the signature.
      brightness:
        { type: integer, min: 0, max: 255, signature: false, description: "Light brightness" }
      transition:
        { type: number, min: 0, max: 300, signature: false, description: "Transition seconds" }
      color_temp_kelvin:
        { type: integer, min: 1000, max: 10000, signature: false, description: "Color temperature" }
      rgb_color:
        type: array
        items: { type: integer, min: 0, max: 255 }
        max_items: 3
        signature: false
        description: "RGB triple"
    risk: high
    preview:
      renderer: entity_state
      lookups:
        # skipped when the call names no entity; a failure only drops the current state
        - { id: state, path: "/api/states/{entity_id}", on_error: omit }
    request:
      method: POST
      path: "/api/services/{domain}/{service}"
      body:
        include: [entity_id, brightness, transition, color_temp_kelvin, rgb_color]
    response:
      wrap: "result"

  ha_fire_event:
    description: "Fire a Home Assistant event"
    signature: "{event_type}"
    args:
      event_type:
        required: true
        validate: "^[a-z][a-z0-9_.]*$"
    risk: high
    preview:
      renderer: entity_state
    request:
      method: POST
      path: "/api/events/{event_type}"
      body_exclude: [event_type]

  # Automation definitions (the config API Home Assistant's own editor uses). Only automations
  # made in the UI, stored in automations.yaml, have an id and can be read or written here.
  ha_get_automation_config:
    description: >-
      Get an automation's definition (alias, triggers, conditions, actions) by its id. The id
      is the `id` attribute of the automation.* entity (see ha_get_state), not the entity_id.
    signature: "{automation_id}"
    args:
      automation_id:
        required: true
        validate: "^[A-Za-z0-9_-]{1,64}$"
        description: "The automation's id attribute"
    risk: low
    request:
      method: GET
      path: "/api/config/automation/config/{automation_id}"

  ha_set_automation_config:
    description: >-
      Create or replace an automation. An existing id is replaced as a whole; a new id creates
      one. Home Assistant validates and reloads automations on save. Use the plural keys
      triggers, conditions and actions, as in Home Assistant 2024.10 and later.
    signature: "{automation_id}"
    args:
      automation_id:
        required: true
        validate: "^[A-Za-z0-9_-]{1,64}$"
        description: "The automation's id attribute; a new one creates an automation"
      alias:
        { required: true, type: string, max_length: 200, signature: false, description: "Name" }
      description: { type: text, max_length: 2000, signature: false }
      mode:
        type: enum
        values: [single, restart, queued, parallel]
        signature: false
        description: "What happens when it triggers while still running"
      max: { type: integer, min: 1, max: 100, signature: false, description: "For queued/parallel" }
      variables: { type: object, signature: false }
      triggers:
        required: true
        type: array
        items: { type: object }
        max_items: 50
        signature: false
      conditions:
        type: array
        items: { type: object }
        max_items: 50
        signature: false
      actions:
        required: true
        type: array
        items: { type: object }
        max_items: 100
        signature: false
    risk: high
    preview:
      renderer: automation
      lookups:
        # a 404 means a new automation; any other failure only drops the diff
        - { id: current, path: "/api/config/automation/config/{automation_id}", on_error: omit }
    request:
      method: POST
      path: "/api/config/automation/config/{automation_id}"
      body:
        include: [alias, description, mode, max, variables, triggers, conditions, actions]

  ha_delete_automation_config:
    description: "Delete an automation made in the UI, by its id attribute"
    signature: "{automation_id}"
    args:
      automation_id:
        required: true
        validate: "^[A-Za-z0-9_-]{1,64}$"
        description: "The automation's id attribute"
    risk: high
    preview:
      renderer: automation
      lookups:
        - { id: current, path: "/api/config/automation/config/{automation_id}", on_error: omit }
    request:
      method: DELETE
      path: "/api/config/automation/config/{automation_id}"
