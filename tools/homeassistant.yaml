tools:
  ha_get_state:
    description: "Get entity state from Home Assistant"
    signature: "{entity_id}"
    args:
      entity_id:
        required: true
        validate: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
    risk: low
    remember: signature
    request:
      method: GET
      path: "/api/states/{entity_id}"

  ha_get_states:
    description: "Get all entity states from Home Assistant"
    risk: low
    request:
      method: GET
      path: "/api/states"
    response:
      wrap: "states"

  ha_get_services:
    description: "List available services and their fields"
    risk: low
    request:
      method: GET
      path: "/api/services"
    response:
      wrap: "services"

  ha_get_history:
    description: "Get state history for an entity (last 24h)"
    signature: "{entity_id}"
    args:
      entity_id:
        required: true
        validate: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
    risk: low
    remember: signature
    request:
      method: GET
      path: "/api/history/period"
      query:
        filter_entity_id: "{entity_id}"
    response:
      wrap: "history"

  ha_get_logbook:
    description: "Get logbook entries for an entity (last 24h)"
    signature: "{entity_id}"
    args:
      entity_id:
        required: true
        validate: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
    risk: low
    remember: signature
    request:
      method: GET
      path: "/api/logbook"
      query:
        entity: "{entity_id}"
    response:
      wrap: "logbook"

  ha_get_config:
    description: "Get Home Assistant configuration"
    risk: low
    request:
      method: GET
      path: "/api/config"
    response:
      wrap: "config"

  ha_render_template:
    description: "Render a Home Assistant template"
    signature: "{template}"
    args:
      template:
        required: true
        description: "Jinja template"
    risk: low
    request:
      method: POST
      path: "/api/template"
    response:
      wrap: "rendered"

  ha_call_service:
    description: "Call a Home Assistant service"
    signature: "{domain}.{service}, {entity_id}"
    args:
      domain:
        required: true
        validate: "^[a-z][a-z0-9_]*$"
      service:
        required: true
        validate: "^[a-z][a-z0-9_]*$"
      entity_id:
        required: false
        validate: "^[a-z][a-z0-9_]*\\.[a-z0-9][a-z0-9_]*$"
      # Service data: declared and typed, not part of the signature.
      brightness:
        { type: integer, min: 0, max: 255, signature: false, description: "Light brightness" }
      transition:
        { type: number, min: 0, max: 300, signature: false, description: "Transition seconds" }
      color_temp_kelvin:
        { type: integer, min: 1000, max: 10000, signature: false, description: "Color temperature" }
      rgb_color:
        type: array
        items: { type: integer, min: 0, max: 255 }
        max_items: 3
        signature: false
        description: "RGB triple"
    risk: high
    preview:
      renderer: entity_state
      lookups:
        # skipped when the call names no entity; a failure only drops the current state
        - { id: state, path: "/api/states/{entity_id}", on_error: omit }
    request:
      method: POST
      path: "/api/services/{domain}/{service}"
      body:
        include: [entity_id, brightness, transition, color_temp_kelvin, rgb_color]
    response:
      wrap: "result"

  ha_fire_event:
    description: "Fire a Home Assistant event"
    signature: "{event_type}"
    args:
      event_type:
        required: true
        validate: "^[a-z][a-z0-9_.]*$"
    risk: high
    preview:
      renderer: entity_state
    request:
      method: POST
      path: "/api/events/{event_type}"
      body_exclude: [event_type]
