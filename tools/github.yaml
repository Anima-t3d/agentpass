# GitHub tools. One tool per endpoint; there is no generic "call any GitHub path"
# tool. Reads are allowed, writes ask, destructive or security-sensitive tools
# are denied (rules in policy/github.yaml). The token is the service's bearer
# auth and is never visible to agents.
#
# Signature: gh_x(owner/repo[, number]). Titles, bodies and other free text are
# not part of the signature, so they may contain any characters.

x-common:
  owner: &owner
    type: string
    required: true
    max_length: 39
    validate: "[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?"
    description: "Repository owner (user or organization)"
  repo: &repo
    type: string
    required: true
    max_length: 100
    validate: "(?!\\.{1,2}$)[A-Za-z0-9._-]+"
    description: "Repository name"
  number: &number
    { type: integer, required: true, min: 1, description: "Issue or pull request number" }
  branch: &branch
    { type: string, required: true, max_length: 255, validate: "[A-Za-z0-9._/-]+", description: "Branch name" }
  sha: &sha
    { type: string, validate: "[0-9a-f]{40}|[0-9a-f]{64}", signature: false }
  per_page: &per_page
    { type: integer, min: 1, max: 100, default: 30, signature: false }
  page: &page
    { type: integer, min: 1, default: 1, signature: false }
  headers: &headers
    Accept: "application/vnd.github+json"
    X-GitHub-Api-Version: "2022-11-28"

tools:
  # ---------------------------------------------------------------- reads
  gh_list_repos:
    description: "List repositories the token can access"
    args:
      sort: { type: enum, values: [created, updated, pushed, full_name], default: updated }
      per_page: *per_page
      page: *page
    request:
      method: GET
      path: "/user/repos"
      query: { sort: "{sort}", per_page: "{per_page}", page: "{page}" }
      headers: *headers
    response: { max_bytes: 1048576, wrap: repos }
    risk: low

  gh_get_repo:
    description: "Get a repository"
    signature: "{owner}/{repo}"
    args: { owner: *owner, repo: *repo }
    request:
      method: GET
      path: "/repos/{owner}/{repo}"
      headers: *headers
    response: { max_bytes: 1048576 }
    risk: low

  gh_get_branch:
    description: "Get a branch (its head commit)"
    signature: "{owner}/{repo}, {branch}"
    args: { owner: *owner, repo: *repo, branch: *branch }
    request:
      method: GET
      path: "/repos/{owner}/{repo}/branches/{branch:path}"
      headers: *headers
    response: { max_bytes: 1048576 }
    risk: low

  gh_get_contents:
    description: "Get a file (base64 content and blob sha) or list a directory"
    signature: "{owner}/{repo}"
    args:
      owner: *owner
      repo: *repo
      path: { type: string, required: true, max_length: 1024, validate: "[^\\x00-\\x1f\\\\]+", signature: false, description: "Path inside the repository" }
      ref: { type: string, max_length: 255, validate: "[A-Za-z0-9._/-]+", signature: false, description: "Branch, tag or commit; default branch if omitted" }
    request:
      method: GET
      path: "/repos/{owner}/{repo}/contents/{path:path}"
      query: { ref: "{ref}" }
      headers: *headers
    response: { max_bytes: 1048576 }
    risk: low

  gh_list_issues:
    description: "List issues of a repository (pull requests are included by GitHub)"
    signature: "{owner}/{repo}"
    args:
      owner: *owner
      repo: *repo
      state: { type: enum, values: [open, closed, all], default: open }
      per_page: *per_page
      page: *page
    request:
      method: GET
      path: "/repos/{owner}/{repo}/issues"
      query: { state: "{state}", per_page: "{per_page}", page: "{page}" }
      headers: *headers
    response: { max_bytes: 1048576, wrap: issues }
    risk: low

  gh_get_issue:
    description: "Get an issue"
    signature: "{owner}/{repo}, {number}"
    args: { owner: *owner, repo: *repo, number: *number }
    request:
      method: GET
      path: "/repos/{owner}/{repo}/issues/{number}"
      headers: *headers
    response: { max_bytes: 1048576 }
    risk: low

  gh_list_issue_comments:
    description: "List comments on an issue or pull request"
    signature: "{owner}/{repo}, {number}"
    args:
      owner: *owner
      repo: *repo
      number: *number
      per_page: *per_page
      page: *page
    request:
      method: GET
      path: "/repos/{owner}/{repo}/issues/{number}/comments"
      query: { per_page: "{per_page}", page: "{page}" }
      headers: *headers
    response: { max_bytes: 1048576, wrap: comments }
    risk: low

  gh_list_pulls:
    description: "List pull requests of a repository"
    signature: "{owner}/{repo}"
    args:
      owner: *owner
      repo: *repo
      state: { type: enum, values: [open, closed, all], default: open }
      per_page: *per_page
      page: *page
    request:
      method: GET
      path: "/repos/{owner}/{repo}/pulls"
      query: { state: "{state}", per_page: "{per_page}", page: "{page}" }
      headers: *headers
    response: { max_bytes: 1048576, wrap: pulls }
    risk: low

  gh_get_pull:
    description: "Get a pull request"
    signature: "{owner}/{repo}, {number}"
    args: { owner: *owner, repo: *repo, number: *number }
    request:
      method: GET
      path: "/repos/{owner}/{repo}/pulls/{number}"
      headers: *headers
    response: { max_bytes: 1048576 }
    risk: low

  gh_list_workflow_runs:
    description: "List GitHub Actions workflow runs of a repository"
    signature: "{owner}/{repo}"
    args:
      owner: *owner
      repo: *repo
      status:
        type: enum
        values: [queued, in_progress, completed, success, failure, cancelled]
      per_page: *per_page
      page: *page
    request:
      method: GET
      path: "/repos/{owner}/{repo}/actions/runs"
      query: { status: "{status}", per_page: "{per_page}", page: "{page}" }
      headers: *headers
    response: { max_bytes: 1048576 }
    risk: low

  gh_get_workflow_run:
    description: "Get a GitHub Actions workflow run"
    signature: "{owner}/{repo}, {run_id}"
    args:
      owner: *owner
      repo: *repo
      run_id: { type: integer, required: true, min: 1, description: "Workflow run id" }
    request:
      method: GET
      path: "/repos/{owner}/{repo}/actions/runs/{run_id}"
      headers: *headers
    response: { max_bytes: 1048576 }
    risk: low

  # --------------------------------------------------------------- writes
  gh_create_issue:
    description: "Create an issue"
    signature: "{owner}/{repo}"
    args:
      owner: *owner
      repo: *repo
      title: { type: string, required: true, max_length: 256, signature: false }
      body: { type: text, max_length: 65536 }
      labels:
        type: array
        items: { type: string, max_length: 50 }
        max_items: 10
        signature: false
    preview:
      max_chars: 20000
      title: "Create issue in {owner}/{repo}: {title}"
      summary: "Create issue in {owner}/{repo}: {title}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "Title", value: "{title}" }
        - { label: "Labels", value: "{labels}" }
        - { label: "Body", value: "{body}" }
    request:
      method: POST
      path: "/repos/{owner}/{repo}/issues"
      headers: *headers
      body: { include: [title, body, labels] }
    response: { max_bytes: 1048576 }
    audit: { redact_args: [body], store_result: truncated }
    risk: medium

  gh_create_issue_comment:
    description: "Comment on an issue or pull request"
    signature: "{owner}/{repo}, {number}"
    args:
      owner: *owner
      repo: *repo
      number: *number
      body: { type: text, required: true, max_length: 65536 }
    preview:
      max_chars: 20000
      lookups:
        - { id: issue, path: "/repos/{owner}/{repo}/issues/{number}", on_error: omit }
      title: "Comment on #{number} in {owner}/{repo}"
      summary: "Comment on #{number} {issue.title} in {owner}/{repo}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "On", value: "#{number} {issue.title} ({issue.state})" }
        - { label: "Comment", value: "{body}" }
    request:
      method: POST
      path: "/repos/{owner}/{repo}/issues/{number}/comments"
      headers: *headers
      body: { include: [body] }
    response: { max_bytes: 1048576 }
    audit: { redact_args: [body], store_result: truncated }
    risk: medium

  gh_create_pull:
    description: "Open a pull request"
    signature: "{owner}/{repo}"
    args:
      owner: *owner
      repo: *repo
      title: { type: string, required: true, max_length: 256, signature: false }
      head: { type: string, required: true, max_length: 255, validate: "[A-Za-z0-9._/:-]+", signature: false }
      base: { type: string, required: true, max_length: 255, validate: "[A-Za-z0-9._/-]+", signature: false }
      body: { type: text, max_length: 65536 }
      draft: { type: boolean, signature: false }
    preview:
      max_chars: 20000
      lookups:
        - { id: compare, path: "/repos/{owner}/{repo}/compare/{base:path}...{head:path}", on_error: omit }
      title: "Open pull request in {owner}/{repo}: {title}"
      summary: "Open pull request {head} into {base} in {owner}/{repo}: {title}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "Title", value: "{title}" }
        - { label: "Branches", value: "{head} into {base}" }
        - { label: "Draft", value: "{draft}" }
        - { label: "Commits ahead", value: "{compare.ahead_by}" }
        - { label: "Changed files", value: "{compare.files.0.filename} and others (first listed)" }
        - { label: "Body", value: "{body}" }
      warnings:
        - { when: { value: "{compare.ahead_by}", equals: "0" }, text: "The head branch has no commits ahead of the base" }
    request:
      method: POST
      path: "/repos/{owner}/{repo}/pulls"
      headers: *headers
      body: { include: [title, head, base, body, draft] }
    response: { max_bytes: 1048576 }
    audit: { redact_args: [body], store_result: truncated }
    risk: medium

  gh_create_branch:
    description: "Create a branch pointing at an existing commit sha"
    signature: "{owner}/{repo}, {branch}"
    args:
      owner: *owner
      repo: *repo
      branch: *branch
      sha:
        { type: string, required: true, validate: "[0-9a-f]{40}|[0-9a-f]{64}", signature: false, description: "Commit sha the new branch points at" }
    preview:
      lookups:
        - { id: base, path: "/repos/{owner}/{repo}/git/commits/{sha}", on_error: omit }
      title: "Create branch {branch} in {owner}/{repo}"
      summary: "Create branch {branch} in {owner}/{repo} from {sha}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "New branch", value: "{branch}" }
        - { label: "From commit", value: "{sha}" }
        - { label: "Commit message", value: "{base.message}" }
    request:
      method: POST
      path: "/repos/{owner}/{repo}/git/refs"
      headers: *headers
      body: { include: [sha], map: { ref: "refs/heads/{branch}" } }
    response: { max_bytes: 1048576 }
    risk: medium

  gh_put_contents:
    description: >-
      Create or update one file on a branch with a commit. content is the base64 of the whole new
      file. To update an existing file pass sha, the blob sha from gh_get_contents; GitHub rejects
      the write if the file has changed since.
    signature: "{owner}/{repo}, {branch}"
    args:
      owner: *owner
      repo: *repo
      branch: *branch
      path: { type: string, required: true, max_length: 1024, validate: "[^\\x00-\\x1f\\\\]+", signature: false, description: "Path inside the repository" }
      message: { type: text, required: true, max_length: 4096, signature: false, description: "Commit message" }
      content:
        { type: text, required: true, max_length: 1400000, validate: "[A-Za-z0-9+/=\\r\\n]*", signature: false, description: "Base64 of the new file content" }
      sha: *sha
    preview:
      renderer: diff
      lookups:
        - { id: contents, path: "/repos/{owner}/{repo}/contents/{path:path}", query: { ref: "{branch}" }, on_error: omit, timeout: 3 }
        - { id: repo_info, path: "/repos/{owner}/{repo}", on_error: omit }
    request:
      method: PUT
      path: "/repos/{owner}/{repo}/contents/{path:path}"
      headers: *headers
      body: { include: [branch, message, content, sha] }
    response: { max_bytes: 1048576 }
    audit: { redact_args: [content], store_result: truncated }
    risk: medium

  gh_update_issue:
    description: "Change an issue: title, body, state or labels"
    signature: "{owner}/{repo}, {number}"
    args:
      owner: *owner
      repo: *repo
      number: *number
      title: { type: string, max_length: 256, signature: false }
      body: { type: text, max_length: 65536 }
      state: { type: enum, values: [open, closed], signature: false }
      labels:
        type: array
        items: { type: string, max_length: 50 }
        max_items: 10
        signature: false
    preview:
      max_chars: 20000
      lookups:
        - { id: current, path: "/repos/{owner}/{repo}/issues/{number}", on_error: omit }
      title: "Update issue #{number} in {owner}/{repo}"
      summary: "Update issue #{number} {current.title} in {owner}/{repo}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "Issue now", value: "#{number} {current.title} ({current.state})" }
        - { label: "New title", value: "{title}" }
        - { label: "New state", value: "{state}" }
        - { label: "Labels now", value: "{current.labels}" }
        - { label: "New labels (replace all)", value: "{labels}" }
        - { label: "Body now", value: "{current.body}" }
        - { label: "New body", value: "{body}" }
    request:
      method: PATCH
      path: "/repos/{owner}/{repo}/issues/{number}"
      headers: *headers
      body: { include: [title, body, state, labels] }
    response: { max_bytes: 1048576 }
    audit: { redact_args: [body], store_result: truncated }
    risk: medium

  gh_update_pull:
    description: "Change a pull request: title, body, state or base branch"
    signature: "{owner}/{repo}, {number}"
    args:
      owner: *owner
      repo: *repo
      number: *number
      title: { type: string, max_length: 256, signature: false }
      body: { type: text, max_length: 65536 }
      state: { type: enum, values: [open, closed], signature: false }
      base: { type: string, max_length: 255, validate: "[A-Za-z0-9._/-]+", signature: false }
    preview:
      max_chars: 20000
      lookups:
        - { id: current, path: "/repos/{owner}/{repo}/pulls/{number}", on_error: omit }
      title: "Update pull request #{number} in {owner}/{repo}"
      summary: "Update pull request #{number} {current.title} in {owner}/{repo}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "Pull request now", value: "#{number} {current.title} ({current.state})" }
        - { label: "Branches now", value: "{current.head.ref} into {current.base.ref}" }
        - { label: "New title", value: "{title}" }
        - { label: "New state", value: "{state}" }
        - { label: "New base branch", value: "{base}" }
        - { label: "Body now", value: "{current.body}" }
        - { label: "New body", value: "{body}" }
    request:
      method: PATCH
      path: "/repos/{owner}/{repo}/pulls/{number}"
      headers: *headers
      body: { include: [title, body, state, base] }
    response: { max_bytes: 1048576 }
    audit: { redact_args: [body], store_result: truncated }
    risk: medium

  gh_dispatch_workflow:
    description: "Trigger a workflow_dispatch event"
    signature: "{owner}/{repo}, {workflow}"
    args:
      owner: *owner
      repo: *repo
      workflow:
        type: string
        required: true
        max_length: 100
        validate: "[0-9]+|[A-Za-z0-9._-]+\\.ya?ml"
        description: "Workflow file name or id"
      ref: { type: string, required: true, max_length: 255, validate: "[A-Za-z0-9._/-]+", signature: false }
      inputs: { type: object, signature: false, description: "Workflow inputs" }
    request:
      method: POST
      path: "/repos/{owner}/{repo}/actions/workflows/{workflow}/dispatches"
      headers: *headers
      body: { include: [ref, inputs] }
    response: { type: none }
    risk: medium

  # ---------------------------------------- destructive or security-sensitive
  # These exist so the policy can name them; the shared rule set denies all of
  # them. They are never allowed or asked.
  gh_delete_repo:
    description: "Delete a repository"
    signature: "{owner}/{repo}"
    args: { owner: *owner, repo: *repo }
    preview:
      renderer: resource_summary
      lookups:
        - { id: repo_info, path: "/repos/{owner}/{repo}", on_error: omit }
        - { id: prs, path: "/search/issues", query: { q: "repo:{owner}/{repo} type:pr state:open", per_page: "1" }, on_error: omit }
      confirm_text: "{repo}"
      require_page: true
    request:
      method: DELETE
      path: "/repos/{owner}/{repo}"
      headers: *headers
    response: { type: none }
    risk: high

  gh_update_branch_protection:
    description: "Change branch protection rules"
    signature: "{owner}/{repo}, {branch}"
    args:
      owner: *owner
      repo: *repo
      branch: { type: string, required: true, max_length: 255, validate: "[A-Za-z0-9._/-]+" }
      enforce_admins: { type: boolean, required: true, signature: false }
      required_status_checks: { type: object, signature: false }
      required_pull_request_reviews: { type: object, signature: false }
      restrictions: { type: object, signature: false }
    preview:
      title: "Change branch protection of {branch} in {owner}/{repo}"
      summary: "Change branch protection of {branch} in {owner}/{repo}"
      confirm_text: "{repo}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "Branch", value: "{branch}" }
        - { label: "Enforce for admins", value: "{enforce_admins}" }
        - { label: "Required status checks", value: "{required_status_checks}" }
        - { label: "Required reviews", value: "{required_pull_request_reviews}" }
        - { label: "Push restrictions", value: "{restrictions}" }
    request:
      method: PUT
      path: "/repos/{owner}/{repo}/branches/{branch:path}/protection"
      headers: *headers
      body:
        include: [enforce_admins, required_status_checks, required_pull_request_reviews, restrictions]
    response: { max_bytes: 1048576 }
    risk: high

  gh_add_collaborator:
    description: "Add a collaborator to a repository"
    signature: "{owner}/{repo}, {username}"
    args:
      owner: *owner
      repo: *repo
      username: { type: string, required: true, max_length: 39, validate: "[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?" }
      permission: { type: enum, values: [pull, triage, push, maintain, admin], default: push, signature: false }
    preview:
      title: "Give {username} {permission} access to {owner}/{repo}"
      summary: "Give {username} {permission} access to {owner}/{repo}"
      confirm_text: "{repo}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "User", value: "{username}" }
        - { label: "Permission", value: "{permission}" }
    request:
      method: PUT
      path: "/repos/{owner}/{repo}/collaborators/{username}"
      headers: *headers
      body: { include: [permission] }
    response: { type: none }
    risk: high

  gh_create_deploy_key:
    description: "Add a deploy key to a repository"
    signature: "{owner}/{repo}"
    args:
      owner: *owner
      repo: *repo
      title: { type: string, max_length: 100, signature: false }
      key: { type: text, required: true, max_length: 8192 }
      read_only: { type: boolean, signature: false }
    preview:
      title: "Add a deploy key to {owner}/{repo}"
      summary: "Add deploy key {title} to {owner}/{repo} (read only: {read_only})"
      confirm_text: "{repo}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "Title", value: "{title}" }
        - { label: "Read only", value: "{read_only}" }
        - { label: "Public key", value: "{key}" }
    request:
      method: POST
      path: "/repos/{owner}/{repo}/keys"
      headers: *headers
      body: { include: [title, key, read_only] }
    response: { max_bytes: 1048576 }
    audit: { redact_args: [key] }
    risk: high

  gh_delete_deploy_key:
    description: "Remove a deploy key from a repository"
    signature: "{owner}/{repo}, {key_id}"
    args:
      owner: *owner
      repo: *repo
      key_id: { type: integer, required: true, min: 1 }
    preview:
      title: "Remove deploy key {key_id} from {owner}/{repo}"
      summary: "Remove deploy key {key_id} from {owner}/{repo}"
      confirm_text: "{repo}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "Key id", value: "{key_id}" }
    request:
      method: DELETE
      path: "/repos/{owner}/{repo}/keys/{key_id}"
      headers: *headers
    response: { type: none }
    risk: high

  gh_set_actions_secret:
    description: "Create or update a repository Actions secret"
    signature: "{owner}/{repo}, {secret_name}"
    args:
      owner: *owner
      repo: *repo
      secret_name: { type: string, required: true, max_length: 100, validate: "[A-Z_][A-Z0-9_]*" }
      encrypted_value: { type: text, required: true, max_length: 65536 }
      key_id: { type: string, required: true, max_length: 64, validate: "[0-9]+", signature: false }
    preview:
      title: "Set Actions secret {secret_name} in {owner}/{repo}"
      summary: "Set Actions secret {secret_name} in {owner}/{repo}"
      confirm_text: "{repo}"
      fields:
        - { label: "Repository", value: "{owner}/{repo}" }
        - { label: "Secret name", value: "{secret_name}" }
        - { label: "Value", value: "(encrypted, not shown)" }
    request:
      method: PUT
      path: "/repos/{owner}/{repo}/actions/secrets/{secret_name}"
      headers: *headers
      body: { include: [encrypted_value, key_id] }
    response: { type: none }
    audit: { redact_args: [encrypted_value] }
    risk: high
