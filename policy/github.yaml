# Shared rule set for the GitHub tools (tools/github.yaml).
# Use it from an agent file:  extends: [github]
#
# Reads allow, writes ask, destructive or security-sensitive actions deny.
# Deny rules win over everything an agent file says.
#
# Writes to main or master are denied as a *default*, so an agent file can open one
# repository up with an explicit rule (rules beat defaults), e.g.
#   rules: [{pattern: "gh_put_contents(me/notes, main)", action: ask}]
# The approval preview also warns "Writes directly to the default branch".
defaults:
  - pattern: "gh_put_contents(*, main)"
    action: deny
    description: "Writes to main need an explicit rule for that repository"
  - pattern: "gh_put_contents(*, master)"
    action: deny
    description: "Writes to master need an explicit rule for that repository"
  - pattern: "gh_create_branch(*, main)"
    action: deny
    description: "Creating a branch called main needs an explicit rule"
  - pattern: "gh_create_branch(*, master)"
    action: deny
    description: "Creating a branch called master needs an explicit rule"
  - pattern: "gh_get_*"
    action: allow
  - pattern: "gh_list_*"
    action: allow
  - pattern: "gh_create_*"
    action: ask
  - pattern: "gh_dispatch_*"
    action: ask
  - pattern: "gh_*"
    action: ask

rules:
  - pattern: "gh_delete_*"
    action: deny
    description: "Deleting repositories (or anything else on GitHub) is never allowed"
  - pattern: "gh_update_branch_protection*"
    action: deny
    description: "Branch protection cannot be changed through the gateway"
  - pattern: "gh_add_collaborator*"
    action: deny
    description: "Adding collaborators changes who can access the repository"
  - pattern: "gh_*_deploy_key*"
    action: deny
    description: "Deploy keys are credentials"
  - pattern: "gh_set_actions_secret*"
    action: deny
    description: "Actions secrets are credentials"
