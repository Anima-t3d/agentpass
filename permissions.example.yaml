# agentpass permission rules
# Copy to permissions.yaml and customize

# Defaults are evaluated in order — put specific patterns before "*"
defaults:
  - pattern: "ha_get_*"
    action: allow
  - pattern: "ha_call_service*"
    action: ask
  # GitHub (tools/github.yaml): reads allow, writes ask.
  # These rules only match when the `github` service is enabled in gateway.yaml.
  # `config.example.yaml` ships it commented out, so `agentpass check-config`
  # correctly warns "matches no tool in the registry" until you enable it.
  - pattern: "gh_get_*"
    action: allow
  - pattern: "gh_list_*"
    action: allow
  - pattern: "gh_*"
    action: ask
  - pattern: "*"
    action: ask

# Explicit rules — deny always wins over allow/ask regardless of specificity
rules:
  - pattern: "ha_call_service(light.*)"
    action: ask
    description: "Light control requires approval"

  - pattern: "ha_call_service(lock.*)"
    action: deny
    description: "Lock control is always denied"

  - pattern: "ha_fire_event(*)"
    action: deny
    description: "Event firing is always denied"

  # GitHub: destructive or security-sensitive actions are always denied
  - pattern: "gh_delete_*"
    action: deny
    description: "Deleting repositories is always denied"

  - pattern: "gh_update_branch_protection*"
    action: deny
    description: "Branch protection changes are always denied"

  - pattern: "gh_add_collaborator*"
    action: deny
    description: "Adding collaborators is always denied"

  - pattern: "gh_*_deploy_key*"
    action: deny
    description: "Deploy keys are credentials"

  - pattern: "gh_set_actions_secret*"
    action: deny
    description: "Actions secrets are credentials"
